[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-loop-lab"
version = "0.1.0"
description = "Controlled experiments for shared agent context, progressive skills and delegation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain==1.4.9",
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
loop-lab = "loop_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
